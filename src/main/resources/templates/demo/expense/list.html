<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<!--
    Demo Team Expense List

    Mirrors templates/expense/list.html (team tab portion only) with adjustments:
    - Back → /demo/trip
    - "新增" / Statistics / Settlement links → data-demo-cta
    - Tab to "個人記帳" → /demo/trip/personal-expenses (page navigation, not in-page tab)
    - Expense item link → /demo/trip/expenses/{id}
    - Pill bar / chat-widget / cta-modal (demo)
-->
<head th:replace="~{fragments/head :: head(title=${trip.title} + ' - 分帳 - Demo')}"></head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 pb-20">
    <!-- Toast Container -->
    <div th:replace="~{fragments/components :: toast-container}"></div>

    <!-- Header -->
    <header class="glass-card sticky top-0 z-40 rounded-none border-x-0 border-t-0">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a th:href="@{/demo/trip}"
                   class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer"
                   aria-label="返回行程">
                    <svg class="w-5 h-5 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <h1 class="text-h4 text-gray-800 dark:text-gray-100 font-heading">分帳</h1>
            </div>
            <button type="button" data-demo-cta="add-expense"
                    class="btn-cta flex items-center gap-2"
                    aria-label="新增支出">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span class="hidden sm:inline">新增</span>
            </button>
        </div>
    </header>

    <!-- Tab Switcher (page navigation in demo) -->
    <div class="max-w-4xl mx-auto px-4 mt-2 mb-0">
        <div class="relative flex gap-1 p-1 bg-gray-100 dark:bg-gray-800 rounded-xl">
            <div class="absolute top-1 bottom-1 rounded-lg bg-white dark:bg-gray-700 shadow-sm transition-all duration-300 ease-out"
                 style="left: 4px; width: calc(50% - 6px);"></div>
            <button type="button" class="relative z-10 flex-1 py-2.5 px-3 rounded-lg text-sm font-medium text-gray-800 dark:text-gray-100">團隊分帳</button>
            <a th:href="@{/demo/trip/personal-expenses}"
               class="relative z-10 flex-1 py-2.5 px-3 rounded-lg text-sm font-medium text-gray-500 dark:text-gray-400 text-center transition-colors">個人記帳</a>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="max-w-4xl mx-auto px-4 py-6">
        <!-- Summary Card -->
        <section class="glass-card p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100">總覽</h2>
                <div class="flex items-center gap-2">
                    <button type="button" data-demo-cta="view-statistics"
                            class="btn-text text-sm flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                        </svg>
                        統計
                    </button>
                    <button type="button" data-demo-cta="view-settlement"
                            class="btn-text text-sm flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                        </svg>
                        結算
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white/50 dark:bg-gray-800/50 rounded-xl p-4">
                    <p class="text-sm text-gray-500 dark:text-gray-400 mb-1">總支出</p>
                    <p class="text-xl font-semibold text-gray-800 dark:text-gray-100 font-mono"
                       th:text="${#numbers.formatDecimal(totalExpense, 0, 'COMMA', 0, 'POINT')}">0</p>
                    <p class="text-xs text-gray-400 dark:text-gray-500" th:text="${defaultCurrency}">JPY</p>
                </div>

                <div class="bg-white/50 dark:bg-gray-800/50 rounded-xl p-4">
                    <p class="text-sm text-gray-500 dark:text-gray-400 mb-1">您的餘額</p>
                    <p class="text-xl font-semibold font-mono"
                       th:classappend="${userBalance.compareTo(T(java.math.BigDecimal).ZERO) >= 0 ? 'text-success dark:text-green-400' : 'text-error dark:text-red-400'}"
                       th:text="${(userBalance.compareTo(T(java.math.BigDecimal).ZERO) >= 0 ? '+' : '') + #numbers.formatDecimal(userBalance, 0, 'COMMA', 0, 'POINT')}">+0</p>
                    <p class="text-xs"
                       th:classappend="${userBalance.compareTo(T(java.math.BigDecimal).ZERO) >= 0 ? 'text-success/70 dark:text-green-400/70' : 'text-error/70 dark:text-red-400/70'}"
                       th:text="${userBalance.compareTo(T(java.math.BigDecimal).ZERO) >= 0 ? '可收回' : '需支付'}">狀態</p>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-between">
                    <span class="text-sm text-gray-500 dark:text-gray-400">人均花費</span>
                    <span class="font-semibold text-gray-800 dark:text-gray-100 font-mono"
                          th:text="'$' + ${#numbers.formatDecimal(perPersonAverage, 0, 'COMMA', 0, 'POINT')}">$0</span>
                </div>
            </div>
        </section>

        <!-- Expense List -->
        <section>
            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(expensesByDate)}" class="glass-card p-8 text-center">
                <div class="w-24 h-24 mx-auto mb-4 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center">
                    <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                </div>
                <h3 class="text-h4 text-gray-700 dark:text-gray-300 mb-2">還沒有任何支出</h3>
                <p class="text-body-sm text-gray-500 dark:text-gray-400 mb-6">記錄旅途中的支出，輕鬆進行分帳！</p>
                <button type="button" data-demo-cta="add-expense"
                        class="btn-cta inline-flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    新增第一筆支出
                </button>
            </div>

            <!-- Grouped by Date -->
            <div th:each="dateGroup, groupStat : ${expensesByDate}" class="mb-4">
                <div class="sticky top-0 z-10 bg-gray-50/95 dark:bg-gray-900/95 backdrop-blur-sm py-2 -mx-4 px-4 cursor-pointer select-none"
                     data-action="toggle-date-group">
                    <div class="flex items-center gap-3">
                        <div class="flex-shrink-0 w-12 h-12 bg-primary-100 dark:bg-primary-900/30 rounded-xl flex flex-col items-center justify-center">
                            <span class="text-xs text-primary-600 dark:text-primary-400 font-medium"
                                  th:text="${#temporals.format(dateGroup.key, 'EEE')}">Mon</span>
                            <span class="text-lg font-bold text-primary-700 dark:text-primary-300"
                                  th:text="${#temporals.format(dateGroup.key, 'd')}">1</span>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-medium text-gray-800 dark:text-gray-100"
                               th:text="${#temporals.format(dateGroup.key, 'MM月dd日')}">01月01日</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">
                                <span th:text="${#lists.size(dateGroup.value)}">0</span> 筆支出
                            </p>
                        </div>
                        <div class="text-right mr-1">
                            <p class="text-sm font-semibold text-gray-800 dark:text-gray-100 font-mono"
                               th:text="'$' + ${#numbers.formatDecimal(#aggregates.sum(dateGroup.value.![amount]), 0, 'COMMA', 0, 'POINT')}">$0</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-400 dark:text-gray-500 transition-transform duration-200 chevron-icon flex-shrink-0"
                             th:classappend="${groupStat.first} ? 'rotate-180' : ''"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </div>
                </div>

                <div class="expense-group-content space-y-2 mt-2 overflow-hidden transition-all duration-200 ease-out"
                     th:classappend="${groupStat.first} ? '' : 'max-h-0'"
                     th:style="${groupStat.first} ? '' : 'max-height: 0px'">
                    <a th:each="expense : ${dateGroup.value}"
                       th:href="@{/demo/trip/expenses/{expenseId}(expenseId=${expense.id})}"
                       class="block expense-card bg-white dark:bg-gray-800 rounded-xl px-4 py-3 shadow-card hover:shadow-card-hover transition-all duration-200 cursor-pointer">
                        <div class="flex items-center gap-3">
                            <div class="flex-shrink-0 w-9 h-9 rounded-lg flex items-center justify-center"
                                 th:classappend="${expense.category == 'FOOD' ? 'bg-orange-100 dark:bg-orange-900/30' :
                                                  expense.category == 'TRANSPORT' ? 'bg-blue-100 dark:bg-blue-900/30' :
                                                  expense.category == 'ACCOMMODATION' ? 'bg-purple-100 dark:bg-purple-900/30' :
                                                  expense.category == 'ENTERTAINMENT' ? 'bg-pink-100 dark:bg-pink-900/30' :
                                                  'bg-gray-100 dark:bg-gray-700'}">
                                <svg th:if="${expense.category == 'FOOD'}" class="w-4 h-4 text-orange-600 dark:text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                                </svg>
                                <svg th:if="${expense.category == 'TRANSPORT'}" class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                                </svg>
                                <svg th:if="${expense.category == 'ACCOMMODATION'}" class="w-4 h-4 text-purple-600 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                                </svg>
                                <svg th:if="${expense.category == 'ENTERTAINMENT'}" class="w-4 h-4 text-pink-600 dark:text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                <svg th:if="${expense.category == 'OTHER' or expense.category == 'SHOPPING' or expense.category == null}" class="w-4 h-4 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
                                </svg>
                            </div>

                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium text-gray-800 dark:text-gray-100 truncate"
                                   th:text="${expense.description}">支出描述</p>
                                <div class="flex items-center gap-1.5 mt-0.5">
                                    <div class="w-4 h-4 rounded-full bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center">
                                        <span class="text-[10px] font-medium text-primary-600 dark:text-primary-400"
                                              th:text="${expense.paidByName != null ? #strings.substring(expense.paidByName, 0, 1) : '?'}">A</span>
                                    </div>
                                    <span class="text-xs text-gray-500 dark:text-gray-400"
                                          th:text="${expense.paidByName != null ? expense.paidByName + ' 付款' : '未知'}">付款人</span>
                                    <span class="text-gray-300 dark:text-gray-600 text-xs">·</span>
                                    <span class="text-xs text-gray-500 dark:text-gray-400"
                                          th:text="${expense.splitType?.name() == 'EQUAL' ? '均分' :
                                                     expense.splitType?.name() == 'PERCENTAGE' ? '百分比' :
                                                     expense.splitType?.name() == 'CUSTOM' ? '自訂' :
                                                     expense.splitType?.name() == 'SHARES' ? '比例' : '均分'}">均分</span>
                                </div>
                            </div>

                            <div class="text-right flex-shrink-0">
                                <p class="text-sm font-semibold text-gray-800 dark:text-gray-100 font-mono"
                                   th:text="'$' + ${#numbers.formatDecimal(expense.amount, 0, 'COMMA', 0, 'POINT')}">$0</p>
                                <p th:if="${expense.currency != defaultCurrency}"
                                   class="text-[10px] text-gray-400 dark:text-gray-500"
                                   th:text="${expense.currency}">USD</p>
                            </div>
                        </div>

                        <div th:if="${expense.splits != null and #lists.size(expense.splits) > 0}"
                             class="mt-2 flex items-center justify-between min-h-[32px] px-2 -mx-1 rounded-lg">
                            <div class="flex items-center gap-2.5">
                                <div class="flex -space-x-1.5">
                                    <th:block th:each="split, iterStat : ${expense.splits}">
                                        <div th:if="${iterStat.index < 3}"
                                             class="w-6 h-6 rounded-full ring-2 ring-white dark:ring-gray-800 flex items-center justify-center"
                                             th:classappend="${split.settled} ? 'bg-green-100 dark:bg-green-900/30' : 'bg-primary-100 dark:bg-primary-900/30'">
                                            <span class="text-[10px] font-medium"
                                                  th:classappend="${split.settled} ? 'text-green-600 dark:text-green-400' : 'text-primary-600 dark:text-primary-400'"
                                                  th:text="${split.userNickname != null ? #strings.substring(split.userNickname, 0, 1) : '?'}">?</span>
                                        </div>
                                    </th:block>
                                    <div th:if="${#lists.size(expense.splits) > 3}"
                                         class="w-6 h-6 rounded-full ring-2 ring-white dark:ring-gray-800 bg-gray-100 dark:bg-gray-700 flex items-center justify-center">
                                        <span class="text-[10px] font-medium text-gray-600 dark:text-gray-300"
                                              th:text="'+' + (#lists.size(expense.splits) - 3)">+2</span>
                                    </div>
                                </div>
                                <span class="text-xs text-gray-500 dark:text-gray-400"
                                      th:text="${#lists.size(expense.splits)} + ' 人分攤'">3 人分攤</span>
                            </div>
                            <span class="text-xs text-primary-600 dark:text-primary-400 font-medium">查看明細 →</span>
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Dynamic Pill Bar (demo mode) -->
    <div th:replace="~{fragments/components :: trip-pill-bar(tripId=${trip.id}, isDemo=true)}"></div>

    <!-- Demo AI Chat Widget -->
    <div th:replace="~{demo/fragments/chat-widget :: demo-chat-widget}"></div>

    <!-- CTA Modal -->
    <div th:replace="~{demo/fragments/cta-modal :: cta-modal}"></div>

    <!-- Scripts -->
    <script th:src="@{/js/theme-engine.js}" defer></script>
    <script th:src="@{/js/demo.js}" defer></script>
    <script th:src="@{/js/demo-chat.js}" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[data-action="toggle-date-group"]').forEach(function(header) {
                header.addEventListener('click', function() {
                    var content = header.nextElementSibling;
                    if (!content || !content.classList.contains('expense-group-content')) return;
                    var chevron = header.querySelector('.chevron-icon');
                    var isCollapsed = content.classList.contains('max-h-0') || content.style.maxHeight === '0px';
                    if (isCollapsed) {
                        content.style.maxHeight = content.scrollHeight + 'px';
                        content.classList.remove('max-h-0');
                        if (chevron) chevron.classList.add('rotate-180');
                    } else {
                        content.style.maxHeight = '0px';
                        content.classList.add('max-h-0');
                        if (chevron) chevron.classList.remove('rotate-180');
                    }
                });
            });
        });
    </script>
</body>
</html>
