<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<!--
    Demo Personal Expense Page (standalone, not fragment)

    Mirrors templates/expense/personal-tab.html with adjustments:
    - Wrapped as standalone page (real version is a fragment within expense/list.html)
    - Back → /demo/trip
    - Tab switcher → page navigation (team → /demo/trip/expenses)
    - Budget set/edit, 新增, 編輯, 刪除 → data-demo-cta
    - AUTO item link → /demo/trip/expenses/{tripExpenseId}
    - Removed: budget modal, delete confirmation modal
    - Includes Chart.js CDN for category/daily charts
-->
<head th:replace="~{fragments/head :: head(title='個人記帳 - Demo')}"></head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 pb-20">
    <!-- Toast Container -->
    <div th:replace="~{fragments/components :: toast-container}"></div>

    <!-- Header -->
    <header class="glass-card sticky top-0 z-40 rounded-none border-x-0 border-t-0">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a th:href="@{/demo/trip}"
                   class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer"
                   aria-label="返回行程">
                    <svg class="w-5 h-5 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <h1 class="text-h4 text-gray-800 dark:text-gray-100 font-heading">分帳</h1>
            </div>
            <button type="button" data-demo-cta="add-personal-expense"
                    class="btn-cta flex items-center gap-2"
                    aria-label="新增記帳">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span class="hidden sm:inline">新增</span>
            </button>
        </div>
    </header>

    <!-- Tab Switcher -->
    <div class="max-w-4xl mx-auto px-4 mt-2 mb-0">
        <div class="relative flex gap-1 p-1 bg-gray-100 dark:bg-gray-800 rounded-xl">
            <div class="absolute top-1 bottom-1 rounded-lg bg-white dark:bg-gray-700 shadow-sm transition-all duration-300 ease-out"
                 style="left: calc(50% + 2px); width: calc(50% - 6px);"></div>
            <a th:href="@{/demo/trip/expenses}"
               class="relative z-10 flex-1 py-2.5 px-3 rounded-lg text-sm font-medium text-gray-500 dark:text-gray-400 text-center transition-colors">團隊分帳</a>
            <button type="button" class="relative z-10 flex-1 py-2.5 px-3 rounded-lg text-sm font-medium text-gray-800 dark:text-gray-100">個人記帳</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 py-6"
         th:with="currSymbol=${(defaultCurrency ?: 'JPY') == 'TWD' ? 'NT$' : '$'}">
        <!-- Summary card -->
        <div class="mb-3 glass-card overflow-hidden"
             th:if="${personalExpenses != null and not #lists.isEmpty(personalExpenses)}">
            <div class="px-5 pt-4 pb-3">
                <p class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-1">個人總覽</p>
                <p class="text-3xl font-bold text-gray-900 dark:text-white tabular-nums"
                   th:text="${personalSummary != null ? currSymbol + #numbers.formatDecimal(personalSummary.totalAmount, 0, 'COMMA', 0, 'POINT') : currSymbol + '0'}">$0</p>
                <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5" th:text="${defaultCurrency ?: 'JPY'}">JPY</p>
            </div>

            <div class="grid grid-cols-2 divide-x divide-gray-100 dark:divide-gray-700 border-t border-gray-100 dark:border-gray-700">
                <div class="px-5 py-3">
                    <p class="text-xs text-gray-400 dark:text-gray-500 mb-0.5">日均花費</p>
                    <p class="text-lg font-semibold text-gray-800 dark:text-gray-200 tabular-nums"
                       th:text="${personalSummary?.dailyAverage != null ? currSymbol + #numbers.formatDecimal(personalSummary.dailyAverage, 0, 'COMMA', 0, 'POINT') : '-'}">-</p>
                </div>
                <div class="px-5 py-3">
                    <p class="text-xs text-gray-400 dark:text-gray-500 mb-0.5">記帳筆數</p>
                    <p class="text-lg font-semibold text-gray-800 dark:text-gray-200"
                       th:text="${personalExpenses != null ? #lists.size(personalExpenses) : 0} + ' 筆'">0 筆</p>
                </div>
            </div>

            <!-- Budget set -->
            <div class="px-5 py-3 border-t border-gray-100 dark:border-gray-700"
                 th:if="${hasBudget and personalSummary != null}">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-medium text-gray-500 dark:text-gray-400">預算追蹤</span>
                    <div class="flex items-center gap-1.5">
                        <span class="text-xs tabular-nums text-gray-600 dark:text-gray-300">
                            <th:block th:text="${currSymbol + #numbers.formatDecimal(personalSummary.totalAmount, 0, 'COMMA', 0, 'POINT')}"/>
                            <span class="text-gray-300 dark:text-gray-600">/</span>
                            <th:block th:text="${currSymbol + #numbers.formatDecimal(personalSummary.budget, 0, 'COMMA', 0, 'POINT')}"/>
                        </span>
                        <button type="button" data-demo-cta="edit-budget"
                                class="p-1 rounded text-gray-300 hover:text-gray-500 dark:hover:text-gray-300 transition-colors cursor-pointer"
                                aria-label="編輯預算">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-2.5 mb-1.5 overflow-hidden"
                     role="progressbar"
                     th:attr="aria-valuenow=${budgetPercentageCapped}, aria-valuemin=0, aria-valuemax=100"
                     th:aria-label="${'預算使用 ' + budgetPercentageCapped + '%'}">
                    <div class="h-2.5 rounded-full transition-all duration-700 ease-out"
                         th:classappend="${personalSummary.budgetStatus?.name() == 'RED'} ? 'bg-red-500' : (${personalSummary.budgetStatus?.name() == 'YELLOW'} ? 'bg-yellow-400' : 'bg-emerald-500')"
                         th:style="'width: ' + ${budgetPercentageCapped} + '%'"></div>
                </div>
                <p class="text-[11px] font-medium flex items-center gap-1"
                   th:classappend="${personalSummary.budgetStatus?.name() == 'RED'} ? 'text-red-500' : (${personalSummary.budgetStatus?.name() == 'YELLOW'} ? 'text-yellow-500 dark:text-yellow-400' : 'text-emerald-600 dark:text-emerald-400')">
                    <svg th:if="${personalSummary.budgetStatus?.name() == 'RED'}" class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                    <span th:text="${personalSummary.budgetStatus?.name() == 'RED'} ? '已超出預算 ' + ${budgetPercentageCapped} + '%' : (${personalSummary.budgetStatus?.name() == 'YELLOW'} ? '即將到達預算上限 · ' + ${budgetPercentageCapped} + '%' : '預算使用 ' + ${budgetPercentageCapped} + '%')">預算充裕</span>
                </p>
            </div>

            <!-- Budget not set -->
            <div class="px-5 py-3 border-t border-gray-100 dark:border-gray-700 flex items-center justify-between"
                 th:if="${!hasBudget}">
                <div>
                    <p class="text-xs font-medium text-gray-700 dark:text-gray-300">設定旅遊預算</p>
                    <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">追蹤花費進度並掌握預算狀況</p>
                </div>
                <button type="button" data-demo-cta="set-budget"
                        class="text-sm font-medium text-blue-600 dark:text-blue-400 hover:text-blue-700 transition-colors cursor-pointer whitespace-nowrap flex items-center gap-1">
                    設定
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Charts card -->
        <div id="charts-card" class="mb-3 glass-card p-4 transition-opacity duration-500"
             th:if="${personalExpenses != null and not #lists.isEmpty(personalExpenses) and personalSummary != null}">
            <div class="relative flex gap-1 p-1 bg-gray-100 dark:bg-gray-900 rounded-lg mb-4">
                <div id="chart-tab-indicator"
                     class="absolute top-1 bottom-1 rounded-md bg-white dark:bg-gray-700 shadow-sm transition-all duration-300 ease-out"
                     style="left: 4px; width: calc(50% - 6px);"></div>
                <button type="button" data-action="show-chart" data-chart-type="category"
                        id="chart-tab-category"
                        class="relative z-10 flex-1 py-1.5 rounded-md text-xs font-medium transition-colors duration-200 cursor-pointer text-gray-800 dark:text-gray-100">
                    類別分布
                </button>
                <button type="button" data-action="show-chart" data-chart-type="daily"
                        id="chart-tab-daily"
                        class="relative z-10 flex-1 py-1.5 rounded-md text-xs font-medium transition-colors duration-200 cursor-pointer text-gray-500 dark:text-gray-400">
                    每日趨勢
                </button>
            </div>

            <div id="chart-category" class="min-h-[280px] transition-opacity duration-200">
                <div class="relative h-48">
                    <canvas id="personal-category-chart"></canvas>
                </div>
                <div id="personal-category-legend" class="mt-3 grid grid-cols-2 gap-2"></div>
            </div>

            <div id="chart-daily" class="hidden min-h-[200px] transition-opacity duration-200">
                <div id="daily-chart-wrapper" class="min-h-[200px]" style="-webkit-overflow-scrolling: touch">
                    <canvas id="personal-daily-chart" style="height: 200px"></canvas>
                </div>
            </div>
        </div>

        <!-- Expense list -->
        <div class="pb-6 space-y-2"
             th:if="${personalExpenses != null and not #lists.isEmpty(personalExpenses)}">
            <th:block th:each="expense : ${personalExpenses}">
                <!-- AUTO item -->
                <div th:if="${expense.source?.name() == 'AUTO'}"
                     class="bg-white dark:bg-gray-800 rounded-xl shadow-card px-4 py-3 hover:shadow-card-hover transition-all duration-200">
                    <div class="flex items-center gap-3">
                        <div class="flex-shrink-0 w-9 h-9 rounded-lg flex items-center justify-center"
                             th:classappend="${expense.category == 'FOOD'} ? 'bg-orange-100 dark:bg-orange-900/30' : (${expense.category == 'TRANSPORT'} ? 'bg-blue-100 dark:bg-blue-900/30' : (${expense.category == 'ACCOMMODATION'} ? 'bg-purple-100 dark:bg-purple-900/30' : (${expense.category == 'SHOPPING'} ? 'bg-pink-100 dark:bg-pink-900/30' : (${expense.category == 'ENTERTAINMENT'} ? 'bg-rose-100 dark:bg-rose-900/30' : (${expense.category == 'HEALTH'} ? 'bg-emerald-100 dark:bg-emerald-900/30' : 'bg-gray-100 dark:bg-gray-700')))))">
                            <svg th:if="${expense.category == 'FOOD'}" class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                            <svg th:if="${expense.category == 'TRANSPORT'}" class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                            <svg th:if="${expense.category == 'ACCOMMODATION'}" class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                            <svg th:if="${expense.category == 'SHOPPING'}" class="w-4 h-4 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                            <svg th:if="${expense.category == 'ENTERTAINMENT'}" class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <svg th:if="${expense.category == 'HEALTH'}" class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                            <svg th:if="${expense.category == 'OTHER' or expense.category == null}" class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-800 dark:text-gray-100 truncate"
                               th:text="${expense.description}">描述</p>
                            <div class="flex items-center gap-1.5 mt-0.5">
                                <span class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400">自動同步</span>
                                <span class="text-xs text-gray-400 dark:text-gray-500"
                                      th:if="${expense.expenseDate != null}"
                                      th:text="${#temporals.format(expense.expenseDate, 'MM/dd')}"></span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 flex-shrink-0">
                            <p class="text-sm font-semibold text-gray-900 dark:text-white tabular-nums"
                               th:text="${currSymbol + #numbers.formatDecimal(expense.amount, 0, 'COMMA', 2, 'POINT')}">$0</p>
                            <a th:if="${expense.tripExpenseId != null}"
                               th:href="@{/demo/trip/expenses/{expenseId}(expenseId=${expense.tripExpenseId})}"
                               class="text-xs text-blue-500 hover:text-blue-700 cursor-pointer">查看</a>
                        </div>
                    </div>
                </div>

                <!-- MANUAL item -->
                <div th:if="${expense.source?.name() == 'MANUAL'}"
                     class="bg-white dark:bg-gray-800 rounded-xl shadow-card px-4 py-3 hover:shadow-card-hover transition-all duration-200">
                    <div class="flex items-center gap-3">
                        <div class="flex-shrink-0 w-9 h-9 rounded-lg flex items-center justify-center"
                             th:classappend="${expense.category == 'FOOD'} ? 'bg-orange-100 dark:bg-orange-900/30' : (${expense.category == 'TRANSPORT'} ? 'bg-blue-100 dark:bg-blue-900/30' : (${expense.category == 'ACCOMMODATION'} ? 'bg-purple-100 dark:bg-purple-900/30' : (${expense.category == 'SHOPPING'} ? 'bg-pink-100 dark:bg-pink-900/30' : (${expense.category == 'ENTERTAINMENT'} ? 'bg-rose-100 dark:bg-rose-900/30' : (${expense.category == 'HEALTH'} ? 'bg-emerald-100 dark:bg-emerald-900/30' : 'bg-gray-100 dark:bg-gray-700')))))">
                            <svg th:if="${expense.category == 'FOOD'}" class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                            <svg th:if="${expense.category == 'TRANSPORT'}" class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                            <svg th:if="${expense.category == 'ACCOMMODATION'}" class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                            <svg th:if="${expense.category == 'SHOPPING'}" class="w-4 h-4 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                            <svg th:if="${expense.category == 'ENTERTAINMENT'}" class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <svg th:if="${expense.category == 'HEALTH'}" class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                            <svg th:if="${expense.category == 'OTHER' or expense.category == null}" class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-800 dark:text-gray-100 truncate"
                               th:text="${expense.description}">描述</p>
                            <div class="flex items-center gap-1.5 mt-0.5">
                                <span class="text-[10px] font-medium px-1.5 py-0.5 rounded-full"
                                      th:classappend="${expense.category == 'FOOD'} ? 'bg-orange-50 dark:bg-orange-900/20 text-orange-600 dark:text-orange-400' : (${expense.category == 'TRANSPORT'} ? 'bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400' : (${expense.category == 'ACCOMMODATION'} ? 'bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400' : (${expense.category == 'SHOPPING'} ? 'bg-pink-50 dark:bg-pink-900/20 text-pink-600 dark:text-pink-400' : (${expense.category == 'ENTERTAINMENT'} ? 'bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400' : (${expense.category == 'HEALTH'} ? 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 dark:text-emerald-400' : 'bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400')))))"
                                      th:text="${expense.category == 'FOOD'} ? '餐飲' : (${expense.category == 'TRANSPORT'} ? '交通' : (${expense.category == 'ACCOMMODATION'} ? '住宿' : (${expense.category == 'SHOPPING'} ? '購物' : (${expense.category == 'ENTERTAINMENT'} ? '娛樂' : (${expense.category == 'HEALTH'} ? '健康' : '其他')))))">其他</span>
                                <span class="text-gray-200 dark:text-gray-600 text-xs"
                                      th:if="${expense.expenseDate != null}">·</span>
                                <span class="text-xs text-gray-400 dark:text-gray-500"
                                      th:if="${expense.expenseDate != null}"
                                      th:text="${#temporals.format(expense.expenseDate, 'MM/dd')}"></span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <p class="text-sm font-semibold text-gray-900 dark:text-white tabular-nums mr-0.5"
                               th:text="${currSymbol + #numbers.formatDecimal(expense.amount, 0, 'COMMA', 2, 'POINT')}">$0</p>
                            <button type="button" data-demo-cta="edit-personal-expense"
                                    class="p-2 text-gray-300 dark:text-gray-600 hover:text-blue-500 transition-colors cursor-pointer min-w-[44px] min-h-[44px] flex items-center justify-center"
                                    aria-label="編輯">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                            </button>
                            <button type="button" data-demo-cta="delete-personal-expense"
                                    class="p-2 text-gray-300 dark:text-gray-600 hover:text-red-500 transition-colors cursor-pointer min-w-[44px] min-h-[44px] flex items-center justify-center"
                                    aria-label="刪除">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>

        <!-- Empty state -->
        <div class="glass-card p-8 text-center"
             th:if="${personalExpenses == null or #lists.isEmpty(personalExpenses)}">
            <div class="w-24 h-24 mx-auto mb-4 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center">
                <svg class="w-12 h-12 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
            </div>
            <h3 class="text-base font-semibold text-gray-700 dark:text-gray-300 mb-2">尚未有個人記帳</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">記錄您的個人花費並追蹤預算</p>
            <button type="button" data-demo-cta="add-personal-expense"
                    class="btn-cta inline-flex items-center gap-2 text-sm px-5 py-2.5 cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                新增第一筆
            </button>
        </div>

        <!-- Chart data (hidden, consumed by Chart.js init) -->
        <div id="personal-chart-data"
             th:if="${personalSummary != null}"
             th:data-category-breakdown="${personalCategoryBreakdownJson}"
             th:data-daily-amounts="${personalDailyAmountsJson}"
             style="display:none">
        </div>
    </div>

    <!-- Dynamic Pill Bar (demo mode) -->
    <div th:replace="~{fragments/components :: trip-pill-bar(tripId=${trip.id}, isDemo=true)}"></div>

    <!-- Demo AI Chat Widget -->
    <div th:replace="~{demo/fragments/chat-widget :: demo-chat-widget}"></div>

    <!-- CTA Modal -->
    <div th:replace="~{demo/fragments/cta-modal :: cta-modal}"></div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" defer></script>

    <!-- Scripts -->
    <script th:src="@{/js/theme-engine.js}" defer></script>
    <script th:src="@{/js/demo.js}" defer></script>
    <script th:src="@{/js/demo-chat.js}" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var dataEl = document.getElementById('personal-chart-data');
            if (!dataEl || typeof Chart === 'undefined') return;

            var categoryBreakdown = {};
            var dailyAmounts = {};
            try { categoryBreakdown = JSON.parse(dataEl.getAttribute('data-category-breakdown') || '{}'); } catch (e) {}
            try { dailyAmounts = JSON.parse(dataEl.getAttribute('data-daily-amounts') || '{}'); } catch (e) {}

            var categoryLabels = { FOOD: '餐飲', TRANSPORT: '交通', ACCOMMODATION: '住宿', SHOPPING: '購物', ENTERTAINMENT: '娛樂', HEALTH: '健康', OTHER: '其他' };
            var categoryColors = { FOOD: '#fb923c', TRANSPORT: '#3b82f6', ACCOMMODATION: '#a855f7', SHOPPING: '#ec4899', ENTERTAINMENT: '#f43f5e', HEALTH: '#10b981', OTHER: '#9ca3af' };

            var catCanvas = document.getElementById('personal-category-chart');
            if (catCanvas) {
                var labels = Object.keys(categoryBreakdown);
                var values = labels.map(function (k) { return categoryBreakdown[k]; });
                var colors = labels.map(function (k) { return categoryColors[k] || '#9ca3af'; });
                new Chart(catCanvas, {
                    type: 'doughnut',
                    data: { labels: labels.map(function (k) { return categoryLabels[k] || k; }), datasets: [{ data: values, backgroundColor: colors }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
                var legendEl = document.getElementById('personal-category-legend');
                if (legendEl) {
                    legendEl.innerHTML = labels.map(function (k, i) {
                        return '<div class="flex items-center gap-2 text-xs"><span class="w-3 h-3 rounded-full" style="background:' + colors[i] + '"></span><span class="text-gray-700 dark:text-gray-300">' + (categoryLabels[k] || k) + '</span><span class="text-gray-400 dark:text-gray-500 ml-auto tabular-nums">' + values[i] + '</span></div>';
                    }).join('');
                }
            }

            var dailyCanvas = document.getElementById('personal-daily-chart');
            if (dailyCanvas) {
                var dlabels = Object.keys(dailyAmounts).sort();
                var dvalues = dlabels.map(function (k) { return dailyAmounts[k]; });
                new Chart(dailyCanvas, {
                    type: 'bar',
                    data: { labels: dlabels, datasets: [{ data: dvalues, backgroundColor: '#3b82f6' }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            }

            // Tab switcher
            document.querySelectorAll('[data-action="show-chart"]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var type = btn.getAttribute('data-chart-type');
                    var catEl = document.getElementById('chart-category');
                    var dailyEl = document.getElementById('chart-daily');
                    var indicator = document.getElementById('chart-tab-indicator');
                    var catTab = document.getElementById('chart-tab-category');
                    var dailyTab = document.getElementById('chart-tab-daily');
                    if (type === 'category') {
                        if (catEl) catEl.classList.remove('hidden');
                        if (dailyEl) dailyEl.classList.add('hidden');
                        if (indicator) indicator.style.left = '4px';
                        if (catTab) catTab.classList.replace('text-gray-500', 'text-gray-800');
                        if (dailyTab) dailyTab.classList.replace('text-gray-800', 'text-gray-500');
                    } else {
                        if (catEl) catEl.classList.add('hidden');
                        if (dailyEl) dailyEl.classList.remove('hidden');
                        if (indicator) indicator.style.left = 'calc(50% + 2px)';
                        if (catTab) catTab.classList.replace('text-gray-800', 'text-gray-500');
                        if (dailyTab) dailyTab.classList.replace('text-gray-500', 'text-gray-800');
                    }
                });
            });
        });
    </script>
</body>
</html>
