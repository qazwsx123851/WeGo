<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<!--
    Demo Activity List - Timeline View

    Mirrors templates/activity/list.html structure with adjustments:
    - Back button → /demo/trip
    - Activity card link → /demo/trip/activities/{id}
    - "新增景點" buttons → data-demo-cta="add-activity"
    - Pill bar → isDemo=true
    - Chat widget → demo/fragments/chat-widget
    - Removed: route optimizer, drag handle, recalculate transport, sortable JS
-->
<head th:replace="~{fragments/head :: head(title='景點列表 - Demo')}"></head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 pb-20">
    <!-- Header -->
    <header class="glass-card sticky top-0 z-40 rounded-none border-x-0 border-t-0">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Back Button & Title -->
            <div class="flex items-center gap-3">
                <a th:href="@{/demo/trip}"
                   class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800
                          transition-colors duration-200 cursor-pointer"
                   aria-label="返回行程">
                    <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <div>
                    <h1 class="text-h4 text-gray-800 dark:text-gray-100 font-heading" th:text="${trip.title}">東京五日遊</h1>
                    <p class="text-caption text-gray-500 dark:text-gray-400">
                        <span th:text="${#temporals.format(trip.startDate, 'MM/dd')}">03/15</span>
                        -
                        <span th:text="${#temporals.format(trip.endDate, 'MM/dd')}">03/19</span>
                    </p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="max-w-4xl mx-auto px-4 py-6">
        <!-- Date Navigation -->
        <div class="mb-6 -mx-4 px-4 overflow-x-auto">
            <div class="flex gap-2 min-w-max pb-2">
                <th:block th:each="date, dateStat : ${dates}">
                    <button type="button"
                            th:classappend="${dateStat.first} ? 'bg-primary-500 text-white' : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200'"
                            th:data-date="${#temporals.format(date, 'yyyy-MM-dd')}"
                            class="demo-date-btn flex-shrink-0 px-4 py-2 rounded-xl font-medium text-sm
                                   border border-gray-200 dark:border-gray-700
                                   hover:border-primary-300 dark:hover:border-primary-600
                                   transition-all duration-200 cursor-pointer min-h-[44px]">
                        <span class="block text-xs opacity-75" th:text="${#temporals.format(date, 'E')}">Mon</span>
                        <span class="block" th:text="${#temporals.format(date, 'M/d')}">3/15</span>
                    </button>
                </th:block>
            </div>
        </div>

        <!-- Activities Timeline -->
        <div class="space-y-6">
            <th:block th:each="dayGroup, groupStat : ${activitiesByDate}">
                <section th:id="'day-' + ${#temporals.format(dayGroup.key, 'yyyy-MM-dd')}"
                         style="scroll-margin-top: 80px;">
                    <!-- Day Header -->
                    <div class="sticky top-[52px] z-10 bg-gray-50/95 dark:bg-gray-900/95 backdrop-blur-sm
                                py-2 -mx-4 px-4 cursor-pointer select-none"
                         role="button"
                         tabindex="0"
                         th:aria-expanded="${groupStat.first} ? 'true' : 'false'"
                         th:aria-controls="'day-content-' + ${#temporals.format(dayGroup.key, 'yyyy-MM-dd')}"
                         data-action="toggle-group">
                        <div class="flex items-center gap-3">
                            <div class="flex-shrink-0 w-12 h-12 rounded-xl bg-primary-100 dark:bg-primary-900/30
                                        flex flex-col items-center justify-center">
                                <span class="text-xs text-primary-600 dark:text-primary-400 font-medium"
                                      th:text="${#temporals.format(dayGroup.key, 'E')}">Mon</span>
                                <span class="text-lg font-bold text-primary-700 dark:text-primary-300"
                                      th:text="${#temporals.day(dayGroup.key)}">15</span>
                            </div>
                            <div class="flex-1">
                                <h2 class="text-sm font-medium text-gray-800 dark:text-gray-100"
                                    th:text="${#temporals.format(dayGroup.key, 'M月d日')}">3月15日</h2>
                                <p class="text-xs text-gray-500 dark:text-gray-400">
                                    <span th:text="${#lists.size(dayGroup.value)}">0</span> 個景點
                                    <th:block th:if="${!#lists.isEmpty(dayGroup.value) and dayGroup.value[0]?.startTime != null}">
                                        <span class="text-gray-300 dark:text-gray-600 mx-1">·</span>
                                        <span th:text="${#temporals.format(dayGroup.value[0]?.startTime, 'HH:mm')}">09:00</span>
                                        <th:block th:with="lastActivity=${dayGroup.value.get(#lists.size(dayGroup.value) - 1)}">
                                            <span th:if="${lastActivity.endTime != null or (lastActivity.startTime != null and #lists.size(dayGroup.value) > 1)}">
                                                -
                                                <span th:if="${lastActivity.endTime != null}"
                                                      th:text="${#temporals.format(lastActivity.endTime, 'HH:mm')}">18:00</span>
                                                <span th:if="${lastActivity.endTime == null and lastActivity.startTime != null}"
                                                      th:text="${#temporals.format(lastActivity.startTime, 'HH:mm')}">17:00</span>
                                            </span>
                                        </th:block>
                                    </th:block>
                                </p>
                            </div>
                            <svg class="w-5 h-5 text-gray-400 dark:text-gray-500 transition-transform duration-200 chevron-icon flex-shrink-0"
                                 th:classappend="${groupStat.first} ? 'rotate-180' : ''"
                                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Activity Cards (Collapsible) -->
                    <div class="activity-group-content overflow-hidden transition-all duration-200 ease-out"
                         th:id="'day-content-' + ${#temporals.format(dayGroup.key, 'yyyy-MM-dd')}"
                         role="region"
                         th:classappend="${groupStat.first} ? '' : 'max-h-0'"
                         th:style="${groupStat.first} ? '' : 'max-height: 0px'">

                    <div th:if="${!#lists.isEmpty(dayGroup.value)}" class="space-y-0">
                        <th:block th:each="activity, activityStat : ${dayGroup.value}">
                            <div class="activity-card relative bg-white dark:bg-gray-800 rounded-xl
                                      border border-gray-100 dark:border-gray-700
                                      p-3 flex gap-3
                                      hover:bg-gray-50 dark:hover:bg-gray-750
                                      active:bg-gray-100 dark:active:bg-gray-700
                                      transition-colors duration-200 touch-manipulation">
                                <a th:href="@{/demo/trip/activities/{activityId}(activityId=${activity.id})}"
                                   class="activity-link flex gap-3 items-start flex-1 cursor-pointer">
                                    <!-- Activity Type Icon -->
                                    <div th:switch="${activity.place?.category}">
                                        <div th:case="'restaurant'"
                                             class="w-10 h-10 rounded-full bg-adventure-100 dark:bg-adventure-900/30
                                                    text-adventure-600 dark:text-adventure-400
                                                    flex items-center justify-center flex-shrink-0">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                      d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                                            </svg>
                                        </div>
                                        <div th:case="'lodging'"
                                             class="w-10 h-10 rounded-full bg-success-light dark:bg-green-900/30
                                                    text-success-dark dark:text-green-400
                                                    flex items-center justify-center flex-shrink-0">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                      d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                                            </svg>
                                        </div>
                                        <div th:case="'transit_station'"
                                             class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700
                                                    text-gray-600 dark:text-gray-400
                                                    flex items-center justify-center flex-shrink-0">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                      d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                                            </svg>
                                        </div>
                                        <div th:case="*"
                                             class="w-10 h-10 rounded-full bg-primary-100 dark:bg-primary-900/30
                                                    text-primary-600 dark:text-primary-400
                                                    flex items-center justify-center flex-shrink-0">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                      d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                      d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                            </svg>
                                        </div>
                                    </div>

                                    <!-- Content -->
                                    <div class="flex-1 min-w-0">
                                        <h4 class="font-medium text-gray-800 dark:text-gray-100 truncate"
                                            th:text="${activity.place?.name ?: '未命名景點'}">淺草寺</h4>
                                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
                                            <span th:if="${activity.startTime}"
                                                  th:text="${#temporals.format(activity.startTime, 'HH:mm')}">10:00</span>
                                            <span th:if="${activity.startTime != null and activity.endTime != null}"> - </span>
                                            <span th:if="${activity.endTime}"
                                                  th:text="${#temporals.format(activity.endTime, 'HH:mm')}">12:00</span>
                                            <span th:if="${activity.durationMinutes}" class="ml-2 text-gray-400">
                                                <span th:text="${activity.durationMinutes >= 60 ? (activity.durationMinutes / 60) + ' 小時' : activity.durationMinutes + ' 分鐘'}">2 小時</span>
                                            </span>
                                        </p>
                                        <p th:if="${activity.note}"
                                           class="text-xs text-gray-400 dark:text-gray-500 mt-1 truncate"
                                           th:text="${activity.note}">記得買御守</p>
                                    </div>
                                </a>
                            </div>

                            <!-- Transit Time Connector -->
                            <th:block th:if="${!activityStat.last}">
                                <th:block th:with="nextActivity=${dayGroup.value[activityStat.index + 1]}">
                                    <div th:if="${nextActivity != null and nextActivity.transportDurationMinutes != null}"
                                         class="flex items-center gap-2 py-2 pl-5 ml-5">
                                        <div class="w-0.5 h-8 bg-gray-200 dark:bg-gray-700"></div>
                                        <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
                                            <span th:switch="${nextActivity.transportMode?.name()}">
                                                <svg th:case="'DRIVING'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 17h8M8 17v4h8v-4M8 17H4.5a1.5 1.5 0 01-1.5-1.5v-5A1.5 1.5 0 014.5 9h15a1.5 1.5 0 011.5 1.5v5a1.5 1.5 0 01-1.5 1.5H16M5 9l1-4h12l1 4"/>
                                                </svg>
                                                <svg th:case="'WALKING'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 4a2 2 0 100-4 2 2 0 000 4zm-1 5.5l-3 3m3-3l3 3m-3-3v8m-3 3l3-3 3 3"/>
                                                </svg>
                                                <svg th:case="'TRANSIT'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 17h8M8 17v2h8v-2M8 17H6a2 2 0 01-2-2V7a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2h-2M8 7h8M8 11h8"/>
                                                </svg>
                                                <svg th:case="*" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                                                </svg>
                                            </span>
                                            <span th:if="${nextActivity.transportDistanceMeters != null}"
                                                  th:text="${nextActivity.transportDistanceMeters >= 1000
                                                      ? #numbers.formatDecimal(nextActivity.transportDistanceMeters / 1000.0, 1, 1) + ' km'
                                                      : nextActivity.transportDistanceMeters + ' m'}">1.2 km</span>
                                            <span th:if="${nextActivity.transportDistanceMeters != null}"
                                                  class="text-gray-300 dark:text-gray-600">·</span>
                                            <span th:text="${nextActivity.transportDurationMinutes} + ' 分鐘'">25 分鐘</span>
                                        </div>
                                    </div>

                                    <div th:if="${nextActivity == null or nextActivity.transportDurationMinutes == null}"
                                         class="h-2"></div>
                                </th:block>
                            </th:block>
                        </th:block>
                    </div>
                    </div><!-- /activity-group-content -->
                </section>
            </th:block>
        </div>

        <!-- Empty State -->
        <div th:if="${#maps.isEmpty(activitiesByDate)}"
             class="glass-card p-8 text-center">
            <div class="w-24 h-24 mx-auto mb-4 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center">
                <svg class="w-12 h-12 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </div>
            <h3 class="text-h4 text-gray-700 dark:text-gray-200 mb-2">還沒有任何景點</h3>
            <p class="text-body-sm text-gray-500 dark:text-gray-400 mb-6">開始新增景點，規劃您的完美行程！</p>
            <button type="button" data-demo-cta="add-activity"
                    class="btn-cta inline-flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                新增景點
            </button>
        </div>
    </main>

    <!-- Floating Action Button (demo: CTA-intercepted) -->
    <button type="button" data-demo-cta="add-activity"
            th:if="${!#maps.isEmpty(activitiesByDate)}"
            class="fixed bottom-24 right-6 w-14 h-14
                   bg-adventure-500 hover:bg-adventure-600
                   rounded-full text-white shadow-lg shadow-adventure-500/30
                   flex items-center justify-center
                   transition-all duration-200 active:scale-95 cursor-pointer z-[52]"
            aria-label="新增景點">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
    </button>

    <!-- Dynamic Pill Bar (demo mode) -->
    <div th:replace="~{fragments/components :: trip-pill-bar(tripId=${trip.id}, isDemo=true)}"></div>

    <!-- Demo AI Chat Widget -->
    <div th:replace="~{demo/fragments/chat-widget :: demo-chat-widget}"></div>

    <!-- CTA Modal -->
    <div th:replace="~{demo/fragments/cta-modal :: cta-modal}"></div>

    <!-- Scripts -->
    <script th:src="@{/js/theme-engine.js}" defer></script>
    <script th:src="@{/js/demo.js}" defer></script>
    <script th:src="@{/js/demo-chat.js}" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Date nav buttons (scroll to corresponding day section)
            document.querySelectorAll('.demo-date-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var date = btn.getAttribute('data-date');
                    document.querySelectorAll('.demo-date-btn').forEach(function(b) {
                        b.classList.remove('bg-primary-500', 'text-white');
                        b.classList.add('bg-white', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-200');
                    });
                    btn.classList.remove('bg-white', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-200');
                    btn.classList.add('bg-primary-500', 'text-white');
                    var target = document.getElementById('day-' + date);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });

            // Day group expand/collapse
            document.querySelectorAll('[data-action="toggle-group"]').forEach(function(header) {
                header.addEventListener('click', function() {
                    var section = header.closest('section');
                    var content = section ? section.querySelector('.activity-group-content') : null;
                    if (!content) return;
                    var chevron = header.querySelector('.chevron-icon');
                    var isExpanded = header.getAttribute('aria-expanded') === 'true';
                    if (isExpanded) {
                        content.style.maxHeight = '0px';
                        content.classList.add('max-h-0');
                        if (chevron) chevron.classList.remove('rotate-180');
                        header.setAttribute('aria-expanded', 'false');
                    } else {
                        content.style.maxHeight = content.scrollHeight + 'px';
                        content.classList.remove('max-h-0');
                        if (chevron) chevron.classList.add('rotate-180');
                        header.setAttribute('aria-expanded', 'true');
                    }
                });
            });
        });
    </script>
</body>
</html>
