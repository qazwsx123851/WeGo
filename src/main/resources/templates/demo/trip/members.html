<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<!--
    Demo Members Page

    Mirrors templates/trip/members.html with adjustments:
    - Back → /demo/trip
    - 邀請成員 / 移除成員 / 變更角色 → data-demo-cta
    - No invite link UI (intentionally null in demo)
    - Pill bar / chat-widget / cta-modal (demo)
-->
<head th:replace="~{fragments/head :: head(title='成員 - Demo')}"></head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 pb-20">
    <!-- Toast Container -->
    <div th:replace="~{fragments/components :: toast-container}"></div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl
                   border-b border-gray-100 dark:border-gray-800">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <a th:href="@{/demo/trip}"
                       class="flex items-center justify-center w-11 h-11 min-w-[44px] min-h-[44px] rounded-full
                              hover:bg-gray-100 dark:hover:bg-gray-800
                              text-gray-600 dark:text-gray-300
                              transition-colors duration-200 cursor-pointer"
                       aria-label="返回行程">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <div>
                        <h1 class="text-h4 text-gray-800 dark:text-gray-100 font-heading">成員</h1>
                        <p class="text-xs text-gray-500 dark:text-gray-400"
                           th:text="${memberCount} + ' 位成員'">3 位成員</p>
                    </div>
                </div>

                <button type="button" data-demo-cta="invite-member"
                        class="btn-cta flex items-center gap-2"
                        aria-label="邀請成員">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                    <span class="hidden sm:inline">邀請</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Members List -->
        <div class="space-y-3">
            <div th:each="member : ${members}"
                 class="glass-card p-4 flex items-center gap-4 hover:shadow-md transition-all duration-200">
                <!-- Avatar -->
                <div class="flex-shrink-0">
                    <img th:if="${member.avatarUrl}" th:src="${member.avatarUrl}"
                         th:alt="${member.nickname}"
                         class="w-12 h-12 rounded-full object-cover ring-2 ring-white dark:ring-gray-800" />
                    <span th:unless="${member.avatarUrl}"
                          class="w-12 h-12 rounded-full bg-primary-100 dark:bg-primary-900/30
                                 flex items-center justify-center text-base font-semibold
                                 text-primary-600 dark:text-primary-400
                                 ring-2 ring-white dark:ring-gray-800"
                          th:text="${member.nickname != null ? #strings.substring(member.nickname, 0, 1) : 'U'}">M</span>
                </div>

                <!-- Info -->
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                        <h4 class="font-medium text-gray-800 dark:text-gray-100 truncate"
                            th:text="${member.nickname}">小明</h4>
                        <!-- "您" badge for current user -->
                        <span th:if="${currentUserId != null and member.userId != null and member.userId.equals(currentUserId)}"
                              class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400">您</span>
                        <!-- Ghost member badge -->
                        <span th:if="${member.isGhost}"
                              class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400">未註冊</span>
                    </div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                        <span th:switch="${member.role?.name()}">
                            <span th:case="'OWNER'">行程擁有者</span>
                            <span th:case="'EDITOR'">編輯者</span>
                            <span th:case="'VIEWER'">檢視者</span>
                        </span>
                    </p>
                </div>

                <!-- Role badge + Actions -->
                <div class="flex items-center gap-2 flex-shrink-0">
                    <span th:switch="${member.role?.name()}"
                          class="text-xs font-medium px-3 py-1 rounded-full">
                        <span th:case="'OWNER'" class="bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400 px-3 py-1 rounded-full">擁有者</span>
                        <span th:case="'EDITOR'" class="bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 px-3 py-1 rounded-full">編輯者</span>
                        <span th:case="'VIEWER'" class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-3 py-1 rounded-full">檢視者</span>
                    </span>

                    <!-- Remove button (only for non-self, demo: CTA) -->
                    <button th:if="${currentUserId == null or member.userId == null or !member.userId.equals(currentUserId)}"
                            type="button" data-demo-cta="remove-member"
                            class="p-2 text-gray-400 hover:text-red-500 transition-colors cursor-pointer"
                            aria-label="移除成員">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Invite Hint Card -->
        <div class="glass-card p-6 mt-6 text-center">
            <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center">
                <svg class="w-6 h-6 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
            </div>
            <p class="text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">邀請朋友一起規劃</p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">最多可加入 10 位成員</p>
            <button type="button" data-demo-cta="invite-member"
                    class="btn-primary inline-flex items-center gap-2 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
                立即邀請
            </button>
        </div>
    </main>

    <!-- Dynamic Pill Bar (demo mode) -->
    <div th:replace="~{fragments/components :: trip-pill-bar(tripId=${trip.id}, isDemo=true)}"></div>

    <!-- Demo AI Chat Widget -->
    <div th:replace="~{demo/fragments/chat-widget :: demo-chat-widget}"></div>

    <!-- CTA Modal -->
    <div th:replace="~{demo/fragments/cta-modal :: cta-modal}"></div>

    <!-- Scripts -->
    <script th:src="@{/js/theme-engine.js}" defer></script>
    <script th:src="@{/js/demo.js}" defer></script>
    <script th:src="@{/js/demo-chat.js}" defer></script>
</body>
</html>
