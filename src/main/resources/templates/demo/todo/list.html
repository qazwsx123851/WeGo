<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<!--
    Demo Todo List Page

    Mirrors templates/todo/list.html with adjustments:
    - Back → /demo/trip
    - "新增" / "編輯" / "刪除" / status toggle → data-demo-cta
    - No filter JS (all todos rendered, grouped by status)
    - Pill bar / chat-widget / cta-modal (demo)
-->
<head th:replace="~{fragments/head :: head(title='待辦事項 - Demo')}"></head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 pb-20">
    <!-- Toast Container -->
    <div th:replace="~{fragments/components :: toast-container}"></div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl
                   border-b border-gray-100 dark:border-gray-800">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <a th:href="@{/demo/trip}"
                       class="flex items-center justify-center w-11 h-11 min-w-[44px] min-h-[44px] rounded-full
                              hover:bg-gray-100 dark:hover:bg-gray-800
                              text-gray-600 dark:text-gray-300
                              transition-colors duration-200 cursor-pointer"
                       aria-label="返回行程">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <div>
                        <h1 class="text-h4 text-gray-800 dark:text-gray-100 font-heading">待辦事項</h1>
                        <p class="text-xs text-gray-500 dark:text-gray-400" th:text="${trip.title}">行程名稱</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <span class="px-3 py-1 rounded-full text-xs font-medium
                                bg-primary-100 dark:bg-primary-900/30
                                text-primary-600 dark:text-primary-400"
                          th:text="${completedTodos} + '/' + ${totalTodos}">3/10</span>

                    <button type="button" data-demo-cta="add-todo"
                            class="flex items-center justify-center w-11 h-11 min-w-[44px] min-h-[44px] rounded-full
                                   bg-adventure-500 hover:bg-adventure-600
                                   text-white shadow-md
                                   transition-all duration-200 cursor-pointer"
                            aria-label="新增待辦">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Stats Summary -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="glass-card p-4 text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1">待處理</p>
                <p class="text-2xl font-bold text-gray-700 dark:text-gray-200" th:text="${pendingTodos}">0</p>
            </div>
            <div class="glass-card p-4 text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1">進行中</p>
                <p class="text-2xl font-bold text-primary-600 dark:text-primary-400" th:text="${inProgressTodos}">0</p>
            </div>
            <div class="glass-card p-4 text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-1">已完成</p>
                <p class="text-2xl font-bold text-success" th:text="${completedTodos}">0</p>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(todos)}" class="glass-card p-8 text-center">
            <div class="w-24 h-24 mx-auto mb-4 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center">
                <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
            </div>
            <h3 class="text-h4 text-gray-700 dark:text-gray-300 mb-2">還沒有待辦事項</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">建立待辦事項追蹤行程準備!</p>
            <button type="button" data-demo-cta="add-todo"
                    class="btn-cta inline-flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                新增第一筆
            </button>
        </div>

        <!-- Todo List -->
        <div th:unless="${#lists.isEmpty(todos)}" class="space-y-3">
            <div th:each="todo : ${todos}"
                 class="glass-card p-4 flex items-start gap-3 hover:shadow-md transition-all duration-200">
                <!-- Status checkbox (demo: CTA-intercepted) -->
                <button type="button" data-demo-cta="toggle-todo"
                        th:switch="${todo.status.name()}"
                        class="flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center cursor-pointer mt-0.5"
                        th:aria-label="${todo.status.name() == 'COMPLETED'} ? '取消完成' : '標記完成'">
                    <span th:case="'PENDING'"
                          class="w-full h-full rounded-full border-gray-300 dark:border-gray-600"></span>
                    <span th:case="'IN_PROGRESS'"
                          class="w-full h-full rounded-full bg-primary-500 border-primary-500 flex items-center justify-center">
                        <span class="w-2 h-2 bg-white rounded-full"></span>
                    </span>
                    <span th:case="'COMPLETED'"
                          class="w-full h-full rounded-full bg-success border-success flex items-center justify-center text-white">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                        </svg>
                    </span>
                </button>

                <!-- Content -->
                <div class="flex-1 min-w-0">
                    <h4 th:class="'font-medium truncate ' + (${todo.status.name() == 'COMPLETED'} ? 'text-gray-400 dark:text-gray-500 line-through' : 'text-gray-800 dark:text-gray-100')"
                        th:text="${todo.title}">待辦事項標題</h4>
                    <p th:if="${todo.description}"
                       class="text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-2"
                       th:text="${todo.description}">描述</p>
                    <div class="flex items-center gap-2 mt-2 flex-wrap">
                        <!-- Status badge -->
                        <span th:switch="${todo.status.name()}"
                              class="text-[10px] font-medium px-2 py-0.5 rounded-full">
                            <span th:case="'PENDING'" class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-full">待處理</span>
                            <span th:case="'IN_PROGRESS'" class="bg-primary-100 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 px-2 py-0.5 rounded-full">進行中</span>
                            <span th:case="'COMPLETED'" class="bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 px-2 py-0.5 rounded-full">已完成</span>
                        </span>

                        <!-- Due date -->
                        <span th:if="${todo.dueDate}"
                              th:class="'flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ' + (${todo.isOverdue} ? 'bg-error-light text-error-dark' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300')">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <span th:text="${#temporals.format(todo.dueDate, 'MM/dd')}">01/15</span>
                        </span>

                        <!-- Assignee -->
                        <span th:if="${todo.assigneeName}" class="flex items-center gap-1">
                            <img th:if="${todo.assigneeAvatarUrl}" th:src="${todo.assigneeAvatarUrl}"
                                 th:alt="${todo.assigneeName}"
                                 class="w-5 h-5 rounded-full object-cover" />
                            <span th:unless="${todo.assigneeAvatarUrl}"
                                  class="w-5 h-5 rounded-full bg-primary-100 dark:bg-primary-900/30
                                         flex items-center justify-center text-[10px] font-medium
                                         text-primary-600 dark:text-primary-400"
                                  th:text="${todo.assigneeName?.length() > 0 ? #strings.substring(todo.assigneeName, 0, 1) : '?'}">M</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400" th:text="${todo.assigneeName}">小明</span>
                        </span>
                    </div>
                </div>

                <!-- Actions (demo: CTA-intercepted) -->
                <div class="flex items-center gap-1 flex-shrink-0">
                    <button type="button" data-demo-cta="edit-todo"
                            class="p-2 text-gray-400 hover:text-blue-500 transition-colors cursor-pointer"
                            aria-label="編輯">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                    </button>
                    <button type="button" data-demo-cta="delete-todo"
                            class="p-2 text-gray-400 hover:text-red-500 transition-colors cursor-pointer"
                            aria-label="刪除">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Dynamic Pill Bar (demo mode) -->
    <div th:replace="~{fragments/components :: trip-pill-bar(tripId=${trip.id}, isDemo=true)}"></div>

    <!-- Demo AI Chat Widget -->
    <div th:replace="~{demo/fragments/chat-widget :: demo-chat-widget}"></div>

    <!-- CTA Modal -->
    <div th:replace="~{demo/fragments/cta-modal :: cta-modal}"></div>

    <!-- Scripts -->
    <script th:src="@{/js/theme-engine.js}" defer></script>
    <script th:src="@{/js/demo.js}" defer></script>
    <script th:src="@{/js/demo-chat.js}" defer></script>
</body>
</html>
