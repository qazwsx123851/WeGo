<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<!--
    Demo Chat Widget Fragment

    Floating chat button + expandable window for unauthenticated demo pages.
    Hits POST /api/demo/chat (no CSRF, no tripId).
    Uses /js/demo-chat.js for behaviour (id-coupled to demo-chat-* IDs below).

    Include in demo templates:
        <div th:replace="~{demo/fragments/chat-widget :: demo-chat-widget}"></div>

    Note: This fragment is intentionally separate from fragments/chat-widget.html,
    which is for authenticated trip pages (it hits /api/trips/{id}/chat).
-->

<th:block th:fragment="demo-chat-widget">

    <!-- Backdrop (mobile only) -->
    <div id="demo-chat-backdrop" class="fixed inset-0 bg-black/30 z-[51] hidden transition-opacity duration-300"></div>

    <!-- Floating Chat Button -->
    <button id="demo-chat-toggle-btn" aria-label="開啟 AI 旅遊助手" class="fixed right-6 bottom-40 z-[52]
                   w-14 h-14 rounded-full
                   bg-primary-500 hover:bg-primary-600 active:bg-primary-700
                   text-white shadow-lg shadow-primary-500/30
                   flex items-center justify-center
                   transition-all duration-200 active:scale-95 cursor-pointer">
        <svg id="demo-chat-icon-open" class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81" />
        </svg>
        <svg id="demo-chat-icon-close" class="w-7 h-7 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>

    <!-- Chat Window -->
    <div id="demo-chat-window" class="fixed inset-x-0 bottom-0 sm:inset-x-auto sm:right-6 sm:bottom-[13rem] z-[52]
                w-full sm:w-[26rem] h-[85dvh] sm:h-[32rem] sm:max-h-[calc(100dvh-10rem)]
                bg-white dark:bg-gray-800
                rounded-t-2xl sm:rounded-2xl shadow-2xl
                border border-gray-200 dark:border-gray-700
                flex flex-col overflow-hidden
                transition-all duration-300 ease-out
                translate-y-full sm:translate-y-0
                sm:origin-bottom-right sm:scale-0
                opacity-0 pointer-events-none">
        <!-- Header -->
        <div class="flex items-center gap-3 px-4 py-2 bg-primary-500 text-white">
            <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81" />
                </svg>
            </div>
            <div class="flex-1 min-w-0">
                <h3 class="font-semibold text-sm">WeGo 旅遊助手</h3>
                <p class="text-xs text-white/80">旅遊、美食、景點推薦</p>
            </div>
            <!-- Expand button (desktop only) -->
            <button id="demo-chat-expand-btn" aria-label="展開聊天視窗" class="hidden sm:flex w-8 h-8 rounded-full bg-white/20
                           items-center justify-center
                           hover:bg-white/30 transition-colors cursor-pointer">
                <svg id="demo-chat-expand-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 4h-4m4 0l-5-5" />
                </svg>
                <svg id="demo-chat-collapse-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 4v1.5M9 4H4m5 0L4 9m11-5v1.5M15 4h5m-5 0l5 5M9 20v-1.5M9 20H4m5 0l-5-5m11 5v-1.5m0 1.5h5m-5 0l5-5" />
                </svg>
            </button>
            <button id="demo-chat-close-header" aria-label="關閉聊天" class="w-8 h-8 rounded-full bg-white/20
                           flex items-center justify-center
                           hover:bg-white/30 transition-colors cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Messages -->
        <div id="demo-chat-messages" class="flex-1 overflow-y-auto overscroll-y-contain px-4 py-3 space-y-3">
            <div class="flex gap-2">
                <div class="w-7 h-7 rounded-full bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center flex-shrink-0 mt-0.5">
                    <svg class="w-4 h-4 text-primary-600 dark:text-primary-400" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81" />
                    </svg>
                </div>
                <div class="bg-gray-100 dark:bg-gray-700 rounded-2xl rounded-tl-sm px-3 py-2 max-w-[88%]">
                    <p class="text-sm text-gray-800 dark:text-gray-200">
                        你好！我是 WeGo 旅遊助手，可以幫你推薦餐廳、景點和行程安排。有什麼想問的嗎？
                    </p>
                </div>
            </div>
        </div>

        <!-- Exhausted Overlay -->
        <div id="demo-chat-overlay" class="absolute inset-0 z-10 hidden flex-col items-center justify-center
             bg-white/80 dark:bg-gray-800/80 backdrop-blur-md rounded-2xl transition-opacity duration-300 opacity-0">
            <div class="text-center px-6">
                <div class="mx-auto w-14 h-14 bg-primary-100 dark:bg-primary-900/30 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-7 h-7 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">Demo 對話次數已達上限</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-5">免費註冊即可無限暢聊 AI 旅遊助手</p>
                <a th:href="@{/oauth2/authorization/google}"
                   class="inline-flex items-center justify-center gap-3 w-full px-6 py-3
                          bg-white dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 rounded-xl shadow-sm
                          hover:shadow-md hover:border-primary-300 dark:hover:border-primary-500 transition-all duration-200
                          font-medium text-gray-700 dark:text-gray-200 mb-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google 帳號登入
                </a>
                <button id="demo-chat-overlay-dismiss"
                    class="text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors cursor-pointer">
                    繼續瀏覽聊天紀錄
                </button>
            </div>
        </div>

        <!-- Input -->
        <div id="demo-chat-input-area" class="px-4 pt-2 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
            <div class="flex items-center bg-gray-50 dark:bg-gray-700 rounded-2xl border border-gray-200 dark:border-gray-600
                        focus-within:ring-2 focus-within:ring-primary-500/50 transition-all duration-200 pl-2 pr-1.5 py-1.5">
                <!-- Search grounding toggle (demo: triggers CTA modal on click) -->
                <button id="demo-chat-search-toggle" type="button" data-demo-cta="search-grounding" aria-label="切換即時搜尋功能"
                    title="即時搜尋 — 註冊後可使用 Google 搜尋取得最新資訊"
                    class="flex-shrink-0 flex items-center justify-center gap-1
                           min-w-[36px] min-h-[36px] px-2 py-1 rounded-full
                           text-gray-400 dark:text-gray-500
                           border border-gray-300 dark:border-gray-500
                           hover:bg-gray-100 dark:hover:bg-gray-600
                           transition-all duration-200 cursor-pointer
                           focus:outline-none focus:ring-2 focus:ring-primary-500/50 mr-1">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                    </svg>
                    <span class="hidden sm:inline text-[11px] font-medium leading-tight whitespace-nowrap">即時搜尋</span>
                </button>
                <textarea id="demo-chat-input" rows="1" maxlength="500" aria-label="輸入訊息" placeholder="輸入你的問題..."
                    class="flex-1 resize-none bg-transparent border-0 py-1.5 text-base
                           text-gray-800 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500
                           focus:outline-none focus:ring-0 focus-visible:ring-0 focus-visible:ring-offset-0 max-h-20 overflow-y-auto"></textarea>
                <button id="demo-chat-send-btn" disabled aria-label="發送訊息"
                    class="w-10 h-10 rounded-xl bg-primary-500 hover:bg-primary-600
                           disabled:bg-gray-300 dark:disabled:bg-gray-600 disabled:cursor-not-allowed
                           text-white flex items-center justify-center transition-colors duration-200 cursor-pointer flex-shrink-0 ml-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5m0 0l-7 7m7-7l7 7" />
                    </svg>
                </button>
            </div>
            <div class="flex justify-between items-center mt-1 px-1">
                <span class="text-[11px] text-gray-400 dark:text-gray-500">Gemini 2.5 Flash</span>
                <span id="demo-chat-remaining" class="text-[11px] text-gray-400 dark:text-gray-500">剩餘 3 次對話</span>
            </div>
        </div>
    </div>

</th:block>

</html>
